<!DOCTYPE html> 
<html>
    <head>
        <link rel="stylesheet" href="../style.css">
        <script src="../JS files/script1.js" defer></script>
    </head>
    <body>
        <section class = "WindowBlueprint">
            <div class = "TitleBar">
                <div class = "TitleText"></div>
                <div class = "TitleActions"></div>
            </div>
            <div class = "AppArea"></div>
        </section>
        <section id = "AppIcons">
            <div class = "FileExplorerIcon">
                <section class = "FileExplorerSA"></section>
                <section class = "FileExplorerSB"></section>
            </div>
            <div class = "CalculatorIcon">
                <section class="CalcBody">
                    <div class="CalcScreen"></div>
                    <section class="CalcBGrid">
                        <section class="CalcBRow"><div class="CalcB"></div><div class="CalcB"></div><div class="CalcB"></div></section>
                        <section class="CalcBRow"><div class="CalcB"></div><div class="CalcB"></div><div class="CalcB"></div></section>
                    </section>
                </section>
            </div>
            <div class = "SettingsIcon">
                <section class="SettingsBody">
                    <section class="SettingsSe1"><section class="SettingsSeDi1"></section></section>
                    <section class="SettingsSe2"><section class="SettingsSeDi2"></section></section>
                </section>
            </div>
            <div class = "TextEditorIcon">
                <section class = "TextEditorBody">A</section>
            </div>
            <div class = "ClockIcon">
                <section class="ClockBody">
                    <svg class="ClockLines" viewBox = "0 0 100 100">
                        <line x1 = "50" y1 = "50" x2 = "100" y2 = "50" stroke = "black"  stroke-width = "10"></line>
                        <line x1 = "50" y1 = "50" x2 = "50" y2 = "100" stroke = "red"  stroke-width = "10"></line>
                    </svg>
                </section>
            </div>
            <div class = "TerminalIcon">
                <section class = "TerminalBody">
                    >_
                </section>
            </div>
            <div class = "CalendarIcon">
                <section class = "CalendarBody">
                    <section class ="CalendarIconTop"></section>
                    <section class ="CalendarIconBottom">
                        <svg class="CalendarIconRow" viewBox = "0 0 75 20">
                            <line x1 = "0" y1 = "10" x2 = "25" y2 = "10" stroke-width = "10" stroke-linecap = "round"></line>
                            <line x1 = "50" y1 = "10" x2 = "75" y2 = "10" stroke-width = "10" stroke-linecap = "round"></line>
                        </svg>
                    </section>
                </section>
            </div>
        </section>
    </body>
</html>
